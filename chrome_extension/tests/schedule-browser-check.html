<!doctype html>
<meta charset="utf-8">
<title>Bulk schedule check</title>
<link rel="stylesheet" href="../src/ui.css">
<table id="flowsheetTable"><tbody></tbody></table>
<output id="result">Running…</output>
<script src="../src/schedule-editor.js"></script>
<script src="../src/recurring-color.js"></script>
<script src="../src/schedule-panel.js"></script>
<script src="../src/ui.js"></script>
<script>
(async function () {
  const date = new Date(2026, 10, 17, 7).getTime();
  const at = index => new Date(date + index * 3600000).toISOString();
  const requested = { hour: 3, interval: 6 };
  const pendingCleanup = new Map();
  const writes = [];
  let rejectSave = false;
  let afterSave = () => {};

  function mount(id, name, state = "planned", index = 18) {
    const row = { id, name, sheetDate: date, start: at(index), frequency: 6, cell: { index, id: id + "-old", state } };
    const tr = document.querySelector("tbody").insertRow();
    tr.className = "pr-item";
    tr.dataset.id = id;
    tr.innerHTML = '<td class="pr-heading"><span class="pb-name"></span></td><td data-hour-index="18"></td>';
    tr.lastChild.dataset.hourIndex = index;
    const heading = tr.querySelector("span");
    heading.textContent = name;

    function open(dialogId, index, contents, save) {
      const editor = document.createElement("section");
      editor.id = dialogId;
      row.dialog = { id: dialogId, index };
      editor.innerHTML = contents + '<div class="bottom-buttons"><button>Done</button></div>';
      document.body.append(editor);
      editor.querySelector(".bottom-buttons button").onclick = () => {
        save(editor);
        row.dialog = null;
        editor.remove();
        afterSave();
      };
      return editor;
    }

    heading.onclick = () => {
      const editor = open("simple-planning-dialog", null,
        '<a aria-label="Unlock planning"></a><select id="start-time" disabled></select>' +
        '<input id="continue-every" aria-controls="intervals" disabled>', el => {
          writes.push("plan " + id);
          row.syncing = true;
          const h = Number(el.querySelector("select").value);
          const frequency = parseInt(el.querySelector("input").value, 10);
          setTimeout(() => {
            row.syncing = false;
            if (rejectSave) { row.error = true; return; }
            row.start = at((h + 17) % 24);
            row.frequency = frequency;
          }, 20);
        });
      const hour = editor.querySelector("select");
      for (let i = 0; i < 24; i++) hour.add(new Option((i || 24) + ":00", String(i)));
      hour.value = String(new Date(row.start).getHours());
      const freq = editor.querySelector("input");
      freq.value = row.frequency + " hrs.";
      editor.querySelector("a").onclick = () => { hour.disabled = freq.disabled = false; };
      freq.oninput = () => {
        const list = document.createElement("div");
        list.id = "intervals";
        const option = document.createElement("div");
        option.dataset.comboboxOption = "";
        option.textContent = freq.value + " hrs.";
        option.onclick = () => { freq.value = option.textContent; list.remove(); };
        list.append(option);
        editor.append(list);
      };
    };
    tr.lastChild.oncontextmenu = () => {
      open("execute-treatment-dialog", index,
        '<div id="highlight"><input type="radio" name="h" value="On" checked>' +
        '<input type="radio" name="h" value="Off"></div>', el => {
          if (!el.querySelector("[value=Off]").checked) throw new Error("Old highlight is on");
          writes.push("clear " + id);
          row.cell = { ...row.cell, state: "clear" };
        });
    };
    return row;
  }

  function run(row, values = requested, guard = () => {}) {
    const read = hour => ({ ...row, cell: hour === new Date(at(row.cell.index)).getHours() ?
      { ...row.cell } : null });
    return SmartFlowScheduleEditor.applyRow(row, values, guard, read, pendingCleanup);
  }
  const check = (ok, message) => { if (!ok) throw new Error(message); };
  try {
    let quietSaves = 0;
    document.addEventListener("click", event => {
      if (event.target.closest(".sf-helper-quiet-editor .bottom-buttons")) quietSaves++;
    }, true);
    const a = mount("a", "Resp. rate"), b = mount("b", "Resp. rate"), c = mount("c", "Diet", "planned", 19);
    const charted = mount("d", "Attitude", "protected");
    for (const row of [a, c, charted]) await run(row);
    check(quietSaves === 5, "All three planning forms and the two old-square forms saved in the background");
    check(writes.join() === "plan a,clear a,plan c,clear c,plan d", "Each row clears its own old block (1 AM or 2 AM)");
    check(b.start === at(18) && a.start === at(20) && c.start === at(20), "Shift from 1 AM to 3 AM by stable ID");
    await run(a);
    check(writes.length === 5, "Already-applied schedule can be retried");
    const retry = mount("retry", "Water", "planned", 17);
    let interrupted = false;
    afterSave = () => { interrupted = true; };
    try { await run(retry, requested, () => { if (interrupted) throw new Error("interrupted"); }); } catch {}
    afterSave = () => {};
    await new Promise(resolve => setTimeout(resolve, 40));
    check(retry.start === at(20) && retry.cell.state === "planned", "The plan saved before cleanup");
    await run(retry);
    check(writes.filter(write => write.endsWith(" retry")).join() === "plan retry,clear retry",
      "Retry clears the original midnight block without a second planning save");
    await run(a, { hour: 0, interval: 24 });
    check(a.frequency === 24 && a.start === at(17), "Midnight and late-list frequency");
    const overlaps = mount("overlaps", "Appetite");
    await run(overlaps, { hour: 19, interval: 6 });
    check(overlaps.cell.state === "planned", "1 AM remains due six hours after 7 PM");
    const noStart = mount("new", "Walk");
    noStart.start = null;
    await run(noStart);
    check(noStart.start === at(20) && noStart.cell.state === "planned", "A missing old start leaves other cells alone");
    const separate = mount("separate", "Walk", "planned", 18);
    separate.start = at(18 - 24);
    separate.frequency = 48;
    await run(separate);
    check(separate.cell.state === "planned", "A manually highlighted square on an off day stays highlighted");
    rejectSave = true;
    let error;
    try { await run(b); } catch (e) { error = e; }
    check(error?.message.includes("could not save") && b.cell.state === "planned", "Failed plan must retain old highlight");
    rejectSave = false;
    b.error = false;
    let navigated = false;
    afterSave = () => { navigated = true; };
    try { await run(b, requested, () => { if (navigated) throw new Error("sheet changed"); }); } catch (e) { error = e; }
    check(error?.message === "sheet changed" && b.cell.state === "planned", "Navigation stops cleanup");
    const fault = mount("fault", "Water");
    const faultHeading = document.querySelector('tr[data-id="fault"] .pb-name');
    faultHeading.addEventListener("click", () => document.querySelector("#start-time").remove(), { once: true });
    try { await run(fault); } catch (e) { error = e; }
    const unfinished = document.querySelector("#simple-planning-dialog");
    check(error?.message.includes("repeating schedule") && unfinished && !unfinished.classList.contains("sf-helper-quiet-editor"),
      "A native form that needs attention is visible again");
    unfinished.remove();
    const fluid = mount("fluid", "Fluids");
    const pink = SmartFlowRecurringColor.palette.find(color => color.name === "Pink");
    const square = document.querySelector('tr[data-id="fluid"] td[data-hour-index]');
    square.dataset.cellParam = fluid.id;
    square.classList.add("planned");
    let colorDialogs = 0;
    square.oncontextmenu = () => {
      colorDialogs++;
      const editor = document.createElement("section");
      editor.id = "execute-treatment-dialog";
      fluid.dialog = { id: editor.id, index: 18 };
      editor.innerHTML = '<div id="highlight"><input type="radio" value="On" checked></div>' +
        '<div class="colors-block"><div class="button6"></div></div><div class="bottom-buttons"><button>Done</button></div>';
      document.body.append(editor);
      const swatch = editor.querySelector(".button6");
      swatch.onclick = () => swatch.classList.add("selected");
      editor.querySelector("button").onclick = () => {
        check(editor.classList.contains("sf-helper-quiet-editor") && swatch.classList.contains("selected"), "Pink selected in background");
        editor.remove();
        delete fluid.dialog;
        setTimeout(() => { fluid.cell.color = pink.color; }, 10);
      };
    };
    const paint = () => SmartFlowScheduleEditor.colorCell(fluid, 18, pink, () => {}, async () => fluid);
    check(await paint() && fluid.cell.state === "planned" && fluid.start === at(18), "Color preserves the planned hour");
    check(!(await paint()), "Already pink");
    for (const state of ["protected", "clear"]) {
      fluid.cell = { ...fluid.cell, state, color: 0xffff00 };
      check(!(await paint()), "Skip " + state + " cell");
    }
    check(colorDialogs === 1, "Retry, blank and charted squares never open a color editor");
    const rows = [a, b, c, charted];
    a.section = "monitoring";
    b.section = c.section = charted.section = "activity";
    window.SmartFlowHelperBridge = { callPageHelper: async () => ({ patient: "test", sheet: "day1", rows }) };
    document.querySelector('[data-sf-helper-tab="schedule"]').click();
    await new Promise(resolve => setTimeout(resolve));
    const panel = document.querySelector('[data-sf-helper-panel="schedule"]');
    check(Array.from(panel.querySelectorAll("label:not([hidden]) select"), el => el.getAttribute("aria-label")).join() === "Start at,Interval",
      "The only schedule inputs are the new start and interval");
    const selectLines = panel.querySelector("button");
    const box = id => document.querySelector('tr[data-id="' + id + '"] .sf-helper-line-checkbox');
    check(!box("a"), "Checkboxes stay off the sheet until Select lines");
    selectLines.click();
    box("b").click();
    box("c").click();
    check(!box("a").checked && box("b").checked, "Duplicate names select independently");
    check(panel.querySelector(".sf-helper-schedule-summary span").textContent === "Resp. rate, Diet", "Selected names");
    check(!document.querySelector("[id$='-planning-dialog']"), "Picking a line leaves its editor closed");
    const oldRow = box("b").closest("tr");
    const newRow = oldRow.cloneNode(true);
    newRow.querySelector("input").remove();
    oldRow.replaceWith(newRow);
    await new Promise(resolve => setTimeout(resolve));
    check(box("b")?.checked && !box("a").checked, "Selection survives replacement of a native row");
    panel.querySelector(".sf-helper-schedule-actions button").click();
    check(!box("b") && !selectLines.hidden, "Cancel removes sheet checkboxes");
    selectLines.click();
    check(!box("b").checked && panel.querySelector(".sf-helper-schedule-summary span").textContent === "None",
      "Starting over clears the previous selection");
    document.querySelector('[data-sf-helper-tab="vitals"]').click();
    check(!box("b"), "Leaving Schedule removes the boxes");
    document.querySelector("#result").textContent = "Passed";
  } catch (error) {
    document.querySelector("#result").textContent = "Failed: " + error.message;
  }
})();
</script>
